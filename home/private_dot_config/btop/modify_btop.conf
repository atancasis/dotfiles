{{- /* chezmoi:modify-template */ -}}
{{- /* btop rewrites this file with every setting, so only these lines are managed. */ -}}
{{- $line := `proc_sorting = "pid"` -}}
{{- if regexMatch `(?m)^proc_sorting\s*=` .chezmoi.stdin -}}
{{-   regexReplaceAll `(?m)^proc_sorting\s*=.*$` .chezmoi.stdin $line -}}
{{- else -}}
{{-   printf "%s%s\n" .chezmoi.stdin $line -}}
{{- end -}}
