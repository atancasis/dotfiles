name: check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tools
        run: |
          # The version .chezmoiversion requires; the runner's Homebrew lags behind.
          sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$RUNNER_TEMP/bin" -t "v$(cat .chezmoiversion)"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
          brew install shellcheck
      - name: Check whitespace
        run: git diff --check "$(git hash-object -t tree /dev/null)" HEAD
      - name: Configure chezmoi
        run: |
          mkdir -p ~/.config/chezmoi
          cat > ~/.config/chezmoi/chezmoi.yaml <<'CONFIG'
          data:
            name: CI
            email: ci@example.com
            signingKey: ""
            hostname: ci-mac
          warnings:
            configFileTemplateHasChanged: false
          CONFIG
      - name: Render templates
        run: chezmoi --source . archive --format tar --output "$RUNNER_TEMP/home.tar"
      - name: Lint shell scripts
        run: |
          mkdir -p "$RUNNER_TEMP/scripts"
          for f in home/.chezmoiscripts/darwin/*; do
            chezmoi --source . execute-template < "$f" > "$RUNNER_TEMP/scripts/$(basename "${f%.tmpl}")"
          done
          shellcheck install.sh home/private_dot_config/shell/exports.sh "$RUNNER_TEMP"/scripts/*
